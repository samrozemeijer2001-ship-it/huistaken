<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Huistaken</title>

<meta name="apple-mobile-web-app-title" content="Huistaken">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <div class="app" id="app">

    <!-- ==================== LAADSCHERM ==================== -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-face face" id="loading-face"></div>
      <p id="loading-text">Verbinden...</p>
    </div>

    <!-- ==================== WELKOM / ONBOARDING ==================== -->
    <!-- Inhoud wordt per stap door app.js opgebouwd -->
    <section id="onboard-screen" class="screen onboard-screen" aria-hidden="true">
      <div class="onboard-inner" id="onboard-inner"></div>
    </section>

    <!-- ==================== HOME SCHERM ==================== -->
    <section id="home-screen" class="screen home-screen active">
      <div class="home-topbar">
        <span class="eyebrow" id="home-eyebrow">HUISTAKEN</span>
        <div class="topbar-actions">
          <button id="rules-fab" class="icon-button" type="button" aria-label="Huisregels">
            <span id="rules-fab-icon"></span>
          </button>
          <button id="settings-fab" class="icon-button" type="button" aria-label="Instellingen">
            <span id="settings-fab-icon"></span>
          </button>
        </div>
      </div>

      <header class="home-header">
        <h1 class="app-title" id="house-title">ONS<br>HUIS</h1>
        <div class="week-block" id="week-block">
          <span class="week-label">WEEK</span>
          <span class="week-num" id="week-num">00</span>
          <span class="week-range" id="week-range-label">–</span>
          <span class="week-left" id="week-left-label"></span>
        </div>
      </header>

      <div class="cards-grid" id="cards-container"></div>

      <!-- Alleen bewoner? Dan een duwtje om huisgenoten uit te nodigen -->
      <button id="invite-nudge" class="invite-nudge" type="button" hidden>
        <span class="eyebrow">NOG NIEMAND HIER</span>
        <span class="invite-nudge-title">NODIG JE HUIS&shy;GENOTEN UIT</span>
        <span class="invite-nudge-code" id="invite-nudge-code"></span>
      </button>
    </section>

    <!-- ==================== PERSOONLIJK TAAKSCHERM ==================== -->
    <section id="detail-screen" class="screen detail-screen" aria-hidden="true">
      <header class="detail-bar">
        <button id="back-button" class="back-button" type="button">
          <span class="back-icon"></span>TERUG
        </button>
        <div class="week-chip" id="detail-week-label">WK</div>
      </header>

      <div class="detail-intro">
        <div class="intro-row">
          <span class="eyebrow" id="detail-greeting">HOI,</span>
          <div class="strikes strikes-lg" id="detail-strikes-row"></div>
        </div>
        <h1 class="detail-name" id="detail-name">NAAM</h1>
      </div>

      <div class="hero">
        <div class="hero-photo" id="hero-photo"><span class="photo-initial" id="hero-initial"></span></div>
        <div class="hero-face face" id="detail-face"></div>
        <div class="hero-task" id="detail-icon"></div>
        <div class="hero-stamp">KLAAR</div>
      </div>

      <div class="task-block">
        <span class="eyebrow" id="task-eyebrow">KLUS VAN DE WEEK</span>
        <h2 class="detail-task-name" id="detail-task-name">TAAK</h2>
      </div>

      <div class="panel">
        <div class="done-note">
          <p class="done-title">NETJES.<br>KLAAR.</p>
          <p class="done-meta" id="done-meta"></p>
        </div>
        <div id="detail-tasks"></div>
      </div>

      <div class="action-bar">
        <button id="detail-button" class="done-button" type="button">IK HEB HET GEDAAN</button>
        <p class="action-note" id="action-note"></p>
      </div>
    </section>

    <div id="status-cover" class="status-cover" aria-hidden="true"></div>

    <!-- ==================== VOLTOOID-ANIMATIE ==================== -->
    <div id="celebrate" class="celebrate" aria-live="polite">
      <div class="confetti" id="confetti"></div>
      <div class="celebrate-face face" id="celebrate-face"></div>
      <p class="celebrate-title">NETJES.<br>KLAAR.</p>
      <p class="celebrate-sub" id="celebrate-sub"></p>
    </div>

    <!-- ==================== ONDERPANELEN ==================== -->
    <div id="sheet-overlay" class="rules-overlay"></div>

    <section id="rules-sheet" class="rules-sheet" aria-hidden="true">
      <div class="rules-sheet-header">
        <h2 class="rules-sheet-title">HUIS&shy;REGELS</h2>
        <button class="icon-button sheet-close" type="button" aria-label="Sluiten"></button>
      </div>
      <div class="rules-list" id="rules-list"></div>
      <div class="penalty-card" id="penalty-card" hidden>
        <span class="eyebrow">STRAF BIJ 3 KRUISJES</span>
        <p id="penalty-text"></p>
      </div>
    </section>

    <section id="settings-sheet" class="rules-sheet settings-sheet" aria-hidden="true">
      <div class="rules-sheet-header">
        <h2 class="rules-sheet-title">INSTEL&shy;LINGEN</h2>
        <button class="icon-button sheet-close" type="button" aria-label="Sluiten"></button>
      </div>
      <div id="settings-body"></div>
    </section>

    <!-- Formulier bovenop een paneel (bewerken van klus, regel, profiel...) -->
    <section id="form-sheet" class="rules-sheet form-sheet" aria-hidden="true">
      <div class="rules-sheet-header">
        <h2 class="form-title" id="form-title">BEWERKEN</h2>
        <button class="icon-button sheet-close" type="button" aria-label="Sluiten"></button>
      </div>
      <form id="form-body" autocomplete="off"></form>
    </section>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <!-- Firebase lokaal meegeleverd (werkt ook straks in de app-store-versie) -->
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="vendor/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=5"></script>

  <script src="icons.js?v=5"></script>
  <script src="templates.js?v=5"></script>
  <script src="backend-local.js?v=5"></script>
  <script src="backend-firebase.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
